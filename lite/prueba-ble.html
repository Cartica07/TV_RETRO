<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV RETRO Lite: prueba Bluetooth</title>
<style>
  :root { --fondo:#0B0F14; --panel:#141B24; --texto:#E6EDF3; --suave:#8B98A5; --acento:#4DD2FF; --ok:#3FB950; --mal:#F85149; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--fondo); color:var(--texto); font:16px/1.4 system-ui, sans-serif; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  .tarjeta { background:var(--panel); border-radius:12px; padding:12px; margin-bottom:12px; }
  .fila { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
  label { color:var(--suave); font-size:.85rem; }
  select, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid #2A3644; background:#0F151C; color:var(--texto); }
  button { background:var(--acento); color:#001018; border:0; font-weight:600; }
  button:disabled { opacity:.4; }
  button.sec { background:#223041; color:var(--texto); }
  #estado { font-weight:600; }
  #resultado { font-size:1.1rem; font-weight:600; min-height:1.4em; }
  #resultado.ok { color:var(--ok); } #resultado.mal { color:var(--mal); }
  #registro { height:220px; overflow:auto; background:#0A0E13; border-radius:8px; padding:8px; font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; }
  progress { width:100%; }
</style>
</head>
<body>
<h1>TV RETRO Lite: prueba Bluetooth</h1>

<div class="tarjeta">
  <div class="fila"><button id="conectar">Conectar a la TV</button><button id="desconectar" class="sec" disabled>Desconectar</button></div>
  <div class="fila">Estado: <span id="estado">sin conexión</span></div>
  <div class="fila"><button id="enviarHora" class="sec" disabled>Enviar hora</button><button id="pedirEstado" class="sec" disabled>Pedir estado</button></div>
</div>

<div class="tarjeta">
  <div class="fila">
    <label for="tamano">Tamaño</label>
    <select id="tamano">
      <option value="5120">5 KB</option>
      <option value="30720">30 KB</option>
      <option value="92160">90 KB</option>
      <option value="102400" selected>100 KB</option>
    </select>
    <label for="trozo">Trozo</label>
    <select id="trozo">
      <option value="18">18 bytes</option>
      <option value="100">100 bytes</option>
      <option value="244" selected>244 bytes</option>
      <option value="500">500 bytes</option>
    </select>
    <label for="ventana">Ventana</label>
    <select id="ventana">
      <option value="1">1</option>
      <option value="4">4</option>
      <option value="8" selected>8</option>
      <option value="16">16</option>
      <option value="32">32</option>
    </select>
  </div>
  <div class="fila">
    <label><input type="checkbox" id="guardar"> Guardar en la memoria de la TV</label>
    <label><input type="checkbox" id="pantalla"> Dibujar la pantalla al recibir</label>
  </div>
  <div class="fila"><button id="enviarPrueba" disabled>Enviar archivo de prueba</button><button id="repetir" class="sec" disabled>Repetir 5 veces</button></div>
  <div class="fila"><button id="barrido" class="sec" disabled>Barrido automático</button></div>
  <progress id="progreso" value="0" max="100"></progress>
  <div id="resultado"></div>
</div>

<div class="tarjeta"><div id="registro"></div></div>

<script src="prueba-ble.js"></script>
</body>
</html>
